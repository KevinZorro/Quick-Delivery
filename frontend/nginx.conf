server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Soporte para rutas de Angular (SPA fallback)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache de assets
  location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
